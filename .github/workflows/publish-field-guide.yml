name: Publish manual CSI checklist
on:
  push:
    branches: [main]
    paths:
      - checklist_data.py
      - manual_steps.py
      - app.js
      - style.css
      - build_html.py
      - schema_v2.json
      - downloads/MM6_Reporting_V2.scl
      - tests/manual_structure_test.py
      - tests/manual_checklist_test.py
      - .github/workflows/publish-field-guide.yml
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: field-guide-publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Install reviewed manual guide when staged
        run: |
          python3 - <<'PY'
          import base64, hashlib, io, lzma, tarfile
          from pathlib import Path
          part=Path('_update/manual-csi.b64')
          if part.exists():
              packed=base64.b64decode(part.read_text().strip(),validate=True)
              assert hashlib.sha256(packed).hexdigest()=='d509dd9c5237f8b7b28f40611ce24f66b61964109d5b668414622cfdfad47050'
              allowed={'manual_steps.py','tests/manual_structure_test.py','tests/manual_checklist_test.py'}
              with tarfile.open(fileobj=io.BytesIO(lzma.decompress(packed)),mode='r:') as archive:
                  assert {m.name for m in archive.getmembers()}==allowed
                  for member in archive.getmembers():
                      path=Path(member.name)
                      assert member.isfile() and not path.is_absolute() and '..' not in path.parts
                      path.parent.mkdir(parents=True,exist_ok=True)
                      path.write_bytes(archive.extractfile(member).read())
              part.unlink()
              print('Manual-guide archive checksum matched.')
          PY
          python3 manual_steps.py --install
      - name: Build and verify manual instructions against unchanged V2 logic
        run: |
          echo 'eb709811803d67a10be673682d831cb80bf25cf814d40c612f753730e17a8b49  downloads/MM6_Reporting_V2.scl' | sha256sum -c -
          python3 build_html.py
          python3 tests/manual_structure_test.py
          python3 tests/v2_model_test.py
          node --check app.js
      - name: Install browser test tools
        run: |
          python3 -m pip install playwright
          python3 -m playwright install --with-deps chromium
      - name: Test manual checklists, code sections, storage and offline use
        env:
          REQUIRE_LIVE_BROWSER: '1'
        run: python3 tests/manual_checklist_test.py
      - name: Save reviewed files and generated page
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add manual_steps.py tests/manual_structure_test.py tests/manual_checklist_test.py tests/manual_structure_results.json tests/manual_checklist_results.json tests/v2_model_results.json app.js style.css build_html.py README.md AGENTS.md index.html content.json sw.js manifest.webmanifest .nojekyll
          git add -u
          if ! git diff --cached --quiet; then
            git commit -m 'Publish hand-built CSI reporting guide with exact variables and code sections'
            git push
          fi
      - name: Prepare public app files
        run: |
          mkdir -p _site/downloads
          cp index.html sw.js manifest.webmanifest .nojekyll _site/
          cp downloads/MM6_Reporting_V2.scl _site/downloads/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publish the checklist
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify published files
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from urllib.request import Request, urlopen
          import hashlib, json, os, time
          base='https://andsuch-mods.github.io/General-AI-Test-Space-7/'
          for name in ['index.html','sw.js','manifest.webmanifest','downloads/MM6_Reporting_V2.scl']:
              expected=Path(name).read_bytes()
              for attempt in range(12):
                  try:
                      request=Request(base+name+'?verify='+os.environ['GITHUB_SHA'],headers={'User-Agent':'Manual-CSI-deployment-check'})
                      with urlopen(request,timeout=20) as response:
                          actual=response.read()
                          assert response.status==200
                      assert actual==expected,'Published content differs: '+name
                      print('PASS live exact match:',name,hashlib.sha256(actual).hexdigest())
                      break
                  except Exception as exc:
                      if attempt==11:raise
                      print('Retry:',name,exc)
                      time.sleep(10)
          browser=json.loads(Path('tests/manual_checklist_results.json').read_text())
          assert browser['live_browser'] is True
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as summary:
              summary.write('Published and verified manual CSI checklist: '+base+'\n\n')
              summary.write(str(browser['passed'])+' live browser checks passed. Manual body sections reconstruct the unchanged V2 logic; main FB display name is CSI_Reporting. No Siemens compilation or PLC test was performed.\n')
          PY
      - name: Keep test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manual-csi-validation
          path: |
            tests/manual_structure_results.json
            tests/manual_checklist_results.json
            tests/v2_model_results.json
            tests/manual_desktop.png
            tests/manual_code.png
            tests/manual_mobile.png
