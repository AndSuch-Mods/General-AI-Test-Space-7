name: Publish machine CSI checklists
on:
  push:
    branches: [main]
    paths:
      - robot_gate_patch.py
      - site_commissioning_notes.py
      - tests/site_commissioning_notes_test.py
      - input_notes.py
      - input_mapping_evidence.md
      - tests/input_notes_test.py
      - machine_rollout.py
      - machine_maps.js
      - tests/rollout_test.py
      - compact_spec.py
      - compact_steps.py
      - retention_notes.py
      - restart_update.py
      - tests/restart_test.py
      - tests/compact_test.py
      - tests/compact_browser_test.py
      - checklist_data.py
      - ladder_steps.py
      - csi_branding.py
      - csi_theme.css
      - app.js
      - style.css
      - build_html.py
      - .github/workflows/publish-field-guide.yml
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: field-guide-publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Install documentation-only input explanation overlay
        run: |
          python3 machine_rollout.py --install
          python3 input_notes.py --install
          python3 robot_gate_patch.py
          python3 site_commissioning_notes.py --install
      - name: Install build and browser tools
        run: |
          python3 -m pip install --disable-pip-version-check Pillow playwright
          python3 -m playwright install --with-deps chromium
      - name: Verify unchanged MM6 ladder and restart behavior
        run: |
          CSI_SKIP_ROLLOUT=1 python3 build_html.py
          python3 tests/restart_test.py
          node --check app.js
          node --check machine_maps.js
      - name: Check existing compact-browser behavior
        env:
          REQUIRE_LIVE_BROWSER: '1'
        run: python3 tests/compact_browser_test.py
      - name: Verify the existing machine-name and copy guide
        env:
          REQUIRE_LIVE_BROWSER: '1'
        run: |
          CSI_SKIP_INPUT_NOTES=1 python3 build_html.py
          python3 tests/rollout_test.py
      - name: Build and verify English input notes and source limits
        env:
          REQUIRE_LIVE_BROWSER: '1'
        run: |
          python3 build_html.py
          python3 tests/input_notes_test.py
      - name: Verify field-confirmed MM6 and detailed MM4/MM5 notes
        env:
          REQUIRE_LIVE_BROWSER: '1'
        run: |
          python3 build_html.py
          python3 tests/site_commissioning_notes_test.py
      - name: Save generated page and test results
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add robot_gate_patch.py site_commissioning_notes.py input_notes.py input_mapping_evidence.md tests/input_notes_test.py tests/site_commissioning_notes_test.py AGENTS.md tests/input_notes_results.json tests/site_commissioning_notes_results.json tests/rollout_results.json tests/restart_results.json tests/compact_results.json tests/compact_browser_results.json build_html.py README.md AGENTS.md index.html content.json compact_reference.json ladder_spec.json machine_rollout_reference.json sw.js manifest.webmanifest .nojekyll
          git add -u
          if ! git diff --cached --quiet; then
            git commit -m 'Publish sourced call-input meanings and pending robot-quality check'
            git push
          fi
      - name: Prepare the public app
        run: |
          mkdir -p _site
          cp index.html sw.js manifest.webmanifest .nojekyll compact_reference.json ladder_spec.json machine_rollout_reference.json input_mapping_evidence.md checklist-icon.svg checklist-icon-32.png checklist-icon-192.png checklist-icon-512.png apple-touch-icon.png _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
          retention-days: 1
      - name: Publish the checklist
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify published input guide
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from urllib.request import Request,urlopen
          import hashlib,json,os,time
          base='https://andsuch-mods.github.io/General-AI-Test-Space-7/'
          for name in ['index.html','sw.js','manifest.webmanifest','compact_reference.json','ladder_spec.json','machine_rollout_reference.json','input_mapping_evidence.md']:
              expected=Path(name).read_bytes()
              for attempt in range(12):
                  try:
                      request=Request(base+name+'?verify='+os.environ['GITHUB_SHA'],headers={'User-Agent':'CSI-input-guide-verification'})
                      with urlopen(request,timeout=20) as response:
                          actual=response.read()
                          assert response.status==200
                      assert actual==expected,'Published content differs: '+name
                      print('PASS live exact match:',name,hashlib.sha256(actual).hexdigest())
                      break
                  except Exception as exc:
                      if attempt==11:raise
                      print('Retry:',name,exc)
                      time.sleep(10)
          inputs=json.loads(Path('tests/input_notes_results.json').read_text())
          assert inputs['live_browser'] is True
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as summary:
              summary.write('Published and verified: '+base+'\n\n')
              summary.write('English explanations for all five FB inputs; M50.2/M50.3 mode sources and DB20.DBX0.1 class-1 sequencer-reset source traced in both supplied archives. RobotDataValid is documented as a practical robot-operational gate. The final field-notes overlay adds the field-confirmed MM6 DB56 TIA/Kepware addresses, inherited HMI-template clock lesson, and a detailed MM4/MM5 hunt/verify/copy path without copying MM6 DB numbers or 1500-only clock assumptions.\n\n')
              summary.write(str(inputs['passed'])+' input-note checks passed in addition to prior restart, compact-browser and rollout regressions. The first seven MM6 tasks, 66 FB networks, 12 reporting fields and offsets were not changed. No TIA compilation or hardware diagnostics testing was performed.\n\n')
              summary.write('No extra screenshot/test artifacts retained; required Pages artifact retained for one day. No PLC settings, machine bits or billing settings changed.\n')
          PY
