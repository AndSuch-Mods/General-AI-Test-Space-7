name: Publish compact CSI checklist
on:
  push:
    branches: [main]
    paths:
      - compact_spec.py
      - compact_steps.py
      - restart_update.py
      - tests/restart_test.py
      - tests/compact_test.py
      - tests/compact_browser_test.py
      - checklist_data.py
      - ladder_steps.py
      - csi_branding.py
      - csi_theme.css
      - app.js
      - style.css
      - build_html.py
      - .github/workflows/publish-field-guide.yml
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: field-guide-publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Install reviewed automatic restart update
        run: |
          python3 - <<'PY'
          import base64, hashlib, io, lzma, tarfile
          from pathlib import Path
          part=Path('_update/restart-20260928.b64')
          if part.exists():
              packed=base64.b64decode(part.read_text().strip(),validate=True)
              assert hashlib.sha256(packed).hexdigest()=='6098d3b9fab81577ccfbb29891974d9bc4ddc8fe7d9b9f8a5202f57377b528fd'
              allowed={'restart_update.py','tests/restart_test.py'}
              with tarfile.open(fileobj=io.BytesIO(lzma.decompress(packed)),mode='r:') as archive:
                  assert {m.name for m in archive.getmembers()}==allowed
                  for member in archive.getmembers():
                      path=Path(member.name)
                      assert member.isfile() and not path.is_absolute() and '..' not in path.parts
                      path.parent.mkdir(parents=True,exist_ok=True)
                      path.write_bytes(archive.extractfile(member).read())
              part.unlink()
          PY
          python3 restart_update.py
          python3 compact_steps.py --install
      - name: Install build and browser tools
        run: |
          python3 -m pip install --disable-pip-version-check Pillow playwright
          python3 -m playwright install --with-deps chromium
      - name: Build and test compact timing and retained restart behavior
        run: |
          python3 build_html.py
          python3 tests/restart_test.py
          node --check app.js
      - name: Verify browser checklist and unchanged 12-field map
        env:
          REQUIRE_LIVE_BROWSER: '1'
        run: python3 tests/compact_browser_test.py
      - name: Save reviewed files and generated page
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add restart_update.py tests/restart_test.py tests/restart_results.json compact_spec.py compact_steps.py tests/compact_test.py tests/compact_browser_test.py tests/compact_results.json tests/compact_browser_results.json app.js build_html.py README.md AGENTS.md index.html content.json compact_reference.json ladder_spec.json sw.js manifest.webmanifest .nojekyll
          git add -u
          if ! git diff --cached --quiet; then
            git commit -m 'Remove setup DB; reset live state on startup and retain reporting history'
            git push
          fi
      - name: Prepare the public app
        run: |
          mkdir -p _site
          cp index.html sw.js manifest.webmanifest .nojekyll compact_reference.json ladder_spec.json checklist-icon.svg checklist-icon-32.png checklist-icon-192.png checklist-icon-512.png apple-touch-icon.png _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
          retention-days: 1
      - name: Publish the checklist
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify published automatic restart guide
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from urllib.request import Request,urlopen
          import hashlib,json,os,time
          base='https://andsuch-mods.github.io/General-AI-Test-Space-7/'
          for name in ['index.html','sw.js','manifest.webmanifest','compact_reference.json','ladder_spec.json']:
              expected=Path(name).read_bytes()
              for attempt in range(12):
                  try:
                      request=Request(base+name+'?verify='+os.environ['GITHUB_SHA'],headers={'User-Agent':'CSI-restart-guide-verification'})
                      with urlopen(request,timeout=20) as response:
                          actual=response.read()
                          assert response.status==200
                      assert actual==expected,'Published content differs: '+name
                      print('PASS live exact match:',name,hashlib.sha256(actual).hexdigest())
                      break
                  except Exception as exc:
                      if attempt==11:raise
                      print('Retry:',name,exc)
                      time.sleep(10)
          browser=json.loads(Path('tests/compact_browser_results.json').read_text())
          model=json.loads(Path('tests/restart_results.json').read_text())
          assert browser['live_browser'] is True
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as summary:
              summary.write('Published and verified: '+base+'\n\n')
              summary.write('No CSI_Setup or setup enable write. Retain the 12 report fields and four period keys; all other Static state is non-retentive. First cyclic call clears only live timing and resynchronizes. Day/night names and all 48-byte offsets are unchanged.\n\n')
              summary.write(str(model['base_compact_checks'])+' existing model checks, '+str(model['passed'])+' restart checks and '+str(browser['passed'])+' live browser checks passed. Tests simulate the configured retention; no TIA compilation or CPU power-loss test was performed.\n\n')
              summary.write('Dark mode, user notes, retired setup notes, Completed/restore and offline use are preserved. No additional test artifacts retained; Pages artifact retained for one day.\n')
          PY
