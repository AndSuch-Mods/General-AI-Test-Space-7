name: Publish LAD checklist
on:
  push:
    branches: [main]
    paths:
      - ladder_spec.py
      - ladder_engine.py
      - ladder_steps.py
      - tests/ladder_test.py
      - tests/ladder_browser_test.py
      - checklist_data.py
      - manual_steps.py
      - csi_branding.py
      - csi_theme.css
      - app.js
      - style.css
      - build_html.py
      - schema_v2.json
      - .github/workflows/publish-field-guide.yml
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: field-guide-publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Install the reviewed LAD guide
        run: |
          python3 - <<'PY'
          import base64, hashlib, io, lzma, tarfile
          from pathlib import Path
          parts=[Path('_update/ladder-%d.b64'%i) for i in range(1,4)]
          if any(p.exists() for p in parts):
              assert all(p.exists() for p in parts),'Incomplete LAD update'
              packed=base64.b64decode(''.join(p.read_text().strip() for p in parts),validate=True)
              assert hashlib.sha256(packed).hexdigest()=='0efd37fc1eee880332bc2fb773edee5493419891428f76b593f294a7a3a2aec4'
              allowed={'ladder_spec.py','ladder_engine.py','ladder_steps.py','tests/ladder_test.py','tests/ladder_browser_test.py'}
              with tarfile.open(fileobj=io.BytesIO(lzma.decompress(packed)),mode='r:') as archive:
                  assert {m.name for m in archive.getmembers()}==allowed
                  for member in archive.getmembers():
                      path=Path(member.name)
                      assert member.isfile() and not path.is_absolute() and '..' not in path.parts
                      path.parent.mkdir(parents=True,exist_ok=True)
                      path.write_bytes(archive.extractfile(member).read())
              for p in parts:p.unlink()
              print('Reviewed LAD update checksum matched.')
          PY
          python3 manual_steps.py --install
          python3 csi_branding.py --install
          python3 ladder_steps.py --install
      - name: Install build and browser tools
        run: |
          python3 -m pip install --disable-pip-version-check Pillow playwright
          python3 -m playwright install --with-deps chromium
      - name: Build the ladder checklist and test its network records
        run: |
          echo 'eb709811803d67a10be673682d831cb80bf25cf814d40c612f753730e17a8b49  downloads/MM6_Reporting_V2.scl' | sha256sum -c -
          python3 build_html.py
          python3 tests/ladder_test.py
          node --check app.js
      - name: Test ladder instructions, saved progress and offline use
        env:
          REQUIRE_LIVE_BROWSER: '1'
        run: python3 tests/ladder_browser_test.py
      - name: Save the guide and test results
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ladder_spec.py ladder_engine.py ladder_steps.py tests/ladder_test.py tests/ladder_browser_test.py tests/ladder_results.json tests/ladder_browser_results.json app.js build_html.py README.md AGENTS.md index.html content.json sw.js manifest.webmanifest .nojekyll ladder_spec.json
          git add -u
          if ! git diff --cached --quiet; then
            git commit -m 'Publish hand-built LAD networks, weekday schedule and held shift totals'
            git push
          fi
      - name: Prepare the public app
        run: |
          mkdir -p _site
          cp index.html sw.js manifest.webmanifest .nojekyll ladder_spec.json checklist-icon.svg checklist-icon-32.png checklist-icon-192.png checklist-icon-512.png apple-touch-icon.png _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
          retention-days: 1
      - name: Publish the checklist
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify the published guide and LAD reference
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from urllib.request import Request,urlopen
          import hashlib,json,os,time
          base='https://andsuch-mods.github.io/General-AI-Test-Space-7/'
          names=['index.html','sw.js','manifest.webmanifest','ladder_spec.json','checklist-icon.svg','apple-touch-icon.png']
          for name in names:
              expected=Path(name).read_bytes()
              for attempt in range(12):
                  try:
                      request=Request(base+name+'?verify='+os.environ['GITHUB_SHA'],headers={'User-Agent':'LAD-checklist-verification'})
                      with urlopen(request,timeout=20) as response:
                          actual=response.read()
                          assert response.status==200
                      assert actual==expected,'Published content differs: '+name
                      print('PASS live exact match:',name,hashlib.sha256(actual).hexdigest())
                      break
                  except Exception as exc:
                      if attempt==11:raise
                      print('Retry:',name,exc)
                      time.sleep(10)
          browser=json.loads(Path('tests/ladder_browser_results.json').read_text())
          model=json.loads(Path('tests/ladder_results.json').read_text())
          assert browser['live_browser'] is True
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as summary:
              summary.write('Published and verified manual LAD checklist: '+base+'\n\n')
              summary.write(str(model['passed'])+' authored-network checks and '+str(browser['passed'])+' live browser checks passed. These do not compile LAD in TIA or test a PLC.\n\n')
              summary.write('MM6 instructions now show LAD contacts, coils, boxes and exact pins. Weekday shift windows, weekend exclusions and held shift counts are included. The dark layout and prior notes are preserved; new LAD tasks do not inherit SCL completion.\n\n')
              summary.write('No extra screenshot/test ZIP artifacts retained. Only the required Pages artifact is stored for one day. No PLC, billing or safety-program changes were performed.\n')
          PY
